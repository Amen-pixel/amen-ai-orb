<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05090d" />
  <meta name="description" content="AMEN AI ORB — interactive 3D particle sphere by Amen Quenum." />
  <title>AMEN AI ORB — Amen Quenum</title>
  <style>
    :root { color-scheme: dark; --cyan: #20e6df; --muted: #8aa4aa; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05090d; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #efffff; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 25%, rgba(0,0,0,.25) 68%, rgba(0,0,0,.72) 120%); }
    .topbar { position: fixed; z-index: 2; top: 28px; left: 34px; right: 34px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 11px; letter-spacing: .16em; font-size: 12px; font-weight: 700; }
    .brand-mark { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }
    .status { color: #9ab5b8; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .info { position: fixed; z-index: 2; left: 7vw; bottom: 8vh; pointer-events: none; }
    .eyebrow { color: var(--cyan); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; margin-bottom: 13px; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 66px); line-height: .98; letter-spacing: -.055em; font-weight: 650; }
    .subtitle { margin-top: 15px; color: #a4b8bb; font-size: clamp(12px, 1.3vw, 15px); letter-spacing: .04em; }
    .hint { position: fixed; z-index: 2; right: 34px; bottom: 34px; color: #789094; font-size: 11px; letter-spacing: .08em; text-align: right; line-height: 1.8; }
    .hint strong { color: #c8eeee; font-weight: 500; }
    .controls { position: fixed; z-index: 3; top: 25px; right: 34px; display: flex; gap: 8px; }
    button { border: 1px solid rgba(87, 219, 215, .24); background: rgba(5, 18, 22, .72); color: #dff; border-radius: 999px; padding: 9px 13px; font: inherit; font-size: 11px; letter-spacing: .06em; cursor: pointer; backdrop-filter: blur(12px); transition: .2s ease; }
    button:hover { border-color: var(--cyan); color: white; box-shadow: 0 0 20px rgba(32,230,223,.13); }
    .loading { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #05090d; color: var(--cyan); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; transition: opacity .6s ease; }
    .loading.done { opacity: 0; pointer-events: none; }
    @media (max-width: 650px) {
      .topbar { top: 20px; left: 20px; right: 20px; }
      .controls { top: 58px; right: 20px; }
      .info { left: 22px; bottom: 9vh; }
      .hint { right: 20px; bottom: 18px; font-size: 9px; }
      .status { display: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="stage" aria-label="Sphère 3D interactive"></div>
  <div class="vignette"></div>
  <div class="loading" id="loading">Initialisation de l'expérience 3D</div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span> AMEN QUENUM <span style="color:#557276">/</span> DIGITAL UNIVERSE</div>
    <div class="status">Interactive 3D experience · WebGL</div>
  </header>
  <div class="controls">
    <button id="motionBtn" type="button">PAUSE</button>
    <button id="resetBtn" type="button">RESET VIEW</button>
  </div>
  <section class="info">
    <div class="eyebrow">Software · Machine Learning · MLOps</div>
    <h1>AMEN<br><span style="color:#25e4df">AI ORB.</span></h1>
    <div class="subtitle">Explore ideas. Engineer possibilities.</div>
  </section>
  <div class="hint"><strong>DRAG</strong> to rotate&nbsp;&nbsp;·&nbsp;&nbsp;<strong>SCROLL</strong> to zoom<br>Touch and drag on mobile</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const stage = document.getElementById('stage');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05090d);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.enablePan = false;
    controls.minDistance = 5.2;
    controls.maxDistance = 12;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;

    // Sphère de particules réparties selon une spirale de Fibonacci.
    const count = innerWidth < 650 ? 1450 : 2350;
    const positions = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const phases = new Float32Array(count);
    const radius = 2.05;
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < count; i++) {
      const y = 1 - (i / (count - 1)) * 2;
      const ring = Math.sqrt(1 - y * y);
      const theta = goldenAngle * i;
      const x = Math.cos(theta) * ring;
      const z = Math.sin(theta) * ring;
      positions[i * 3] = x * radius;
      positions[i * 3 + 1] = y * radius;
      positions[i * 3 + 2] = z * radius;
      sizes[i] = 2.2 + Math.random() * 2.3;
      phases[i] = Math.random() * Math.PI * 2;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uPixelRatio: { value: Math.min(devicePixelRatio, 2) } },
      vertexShader: `
        attribute float aSize;
        attribute float aPhase;
        uniform float uTime;
        uniform float uPixelRatio;
        varying float vGlow;
        void main() {
          vec3 p = position;
          float wave = sin(aPhase + uTime * 0.75 + p.y * 2.2) * 0.035;
          p += normalize(position) * wave;
          vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          gl_PointSize = aSize * uPixelRatio * (7.0 / -mvPosition.z);
          vGlow = 0.72 + 0.28 * sin(aPhase + uTime * 1.5);
        }
      `,
      fragmentShader: `
        varying float vGlow;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;
          float core = 1.0 - smoothstep(0.02, 0.24, d);
          float halo = exp(-d * 10.0) * 0.45;
          vec3 cyan = vec3(0.04, 0.92, 0.88);
          vec3 blue = vec3(0.02, 0.48, 0.78);
          vec3 color = mix(blue, cyan, core);
          gl_FragColor = vec4(color, (core + halo) * vGlow);
        }
      `
    });
    const orb = new THREE.Points(geometry, material);
    scene.add(orb);

    // Halo discret et anneaux orbitaux pour accentuer la profondeur.
    const haloGeometry = new THREE.SphereGeometry(2.12, 48, 48);
    const haloMaterial = new THREE.MeshBasicMaterial({ color: 0x08bfc0, wireframe: true, transparent: true, opacity: 0.055 });
    const halo = new THREE.Mesh(haloGeometry, haloMaterial);
    scene.add(halo);

    const rings = new THREE.Group();
    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(2.42 + i * 0.12, 0.006, 8, 180),
        new THREE.MeshBasicMaterial({ color: i === 1 ? 0x20e6df : 0x087f91, transparent: true, opacity: i === 1 ? 0.38 : 0.17 })
      );
      ring.rotation.set(0.8 + i * 0.48, 0.35 + i * 0.55, i * 0.7);
      rings.add(ring);
    }
    scene.add(rings);

    // Quelques étoiles éloignées donnent une sensation d'espace.
    const starCount = 650;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 24;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 16;
      starPositions[i * 3 + 2] = -3 - Math.random() * 12;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x6fc9ce, size: 0.018, transparent: true, opacity: 0.55 }));
    scene.add(stars);

    let paused = false;
    document.getElementById('motionBtn').addEventListener('click', (event) => {
      paused = !paused;
      controls.autoRotate = !paused;
      event.currentTarget.textContent = paused ? 'RESUME' : 'PAUSE';
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      camera.position.set(0, 0, 8.2);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      material.uniforms.uTime.value = t;
      if (!paused) {
        orb.rotation.y = t * 0.055;
        orb.rotation.x = Math.sin(t * 0.16) * 0.055;
        halo.rotation.y = -t * 0.025;
        rings.rotation.y = t * 0.045;
        rings.rotation.x = Math.sin(t * 0.12) * 0.08;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      material.uniforms.uPixelRatio.value = Math.min(devicePixelRatio, 2);
    });
    document.getElementById('loading').classList.add('done');
  </script>
</body>
</html>
